<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabled Lands</title>
<meta name="description" content="Adventure sheet, codewords, paragraph tracker and dice for the Fabled Lands gamebooks.">
<meta name="theme-color" content="#1E140B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fabled Lands">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one fluid column (max 1920px) with masonry-like card columns; navigation lives in fixed tabs on the right edge.
   Single deliberate look: parchment pages, leather chrome, seal-red accent. */
:root {
  color-scheme: light;
  --parch: #EFE5CC;
  --card: #FBF6E8;
  --card2: #F6EED9;
  --field: #FFFDF6;
  --line: #DCCBA4;
  --line2: #E4D6B6;
  --line3: #EADDC0;
  --fieldline: #D3C097;
  --ink: #2B1D10;
  --muted: #6B5537;
  --label: #7A5A1E;
  --red: #8E2A1E;
  --red-d: #6E1F15;
  --on-red: #FBF1DC;
  --leather: #1E140B;
  --leather2: #2B1D10;
  --leather3: #3A2814;
  --leather4: #2E2012;
  --stitch: #5A4326;
  --gold: #D4AF5A;
  --cream: #F3E8CC;
  --tan: #BFAE8C;
  --tan2: #A8977A;
  --ok: #2F5D3A;
  --danger: #C2412D;
  --chip: #EFE1BC;
  --display: 'Cinzel', 'Palatino Linotype', Palatino, Georgia, serif;
  --body: 'EB Garamond', 'Palatino Linotype', Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--parch);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.35;
  font-variant-numeric: lining-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--parch); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #B8860B; outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1920px;
  margin: 0 auto;
  padding-block: 22px 140px;
  padding-left: max(clamp(16px, 3vw, 48px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 3vw, 48px), env(safe-area-inset-right, 0px));
}
.head { padding-right: 52px; margin-bottom: 18px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: 0.16em; color: var(--label); text-transform: uppercase; }
.title { margin: 2px 0 0; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.15; }
.sub { font-size: 17px; color: var(--muted); }

.cols { columns: 340px 4; column-gap: 16px; }
.cols > * { break-inside: avoid; margin: 0 0 16px; }
.cols.c3 { columns: 360px 3; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card.dark { background: var(--leather2); color: var(--cream); border-color: var(--leather2); box-shadow: 0 8px 22px -14px rgba(43,29,16,0.6); }
.card.warn { border-color: #E2C2B4; }
.h2 { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; color: var(--red); text-transform: uppercase; font-weight: 600; }
.dark .h2 { color: var(--gold); }
.muted { color: var(--muted); }
.dark .muted { color: var(--tan); }
.small { font-size: 14px; }
.s15 { font-size: 15px; }
.big { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.huge { font-family: var(--display); font-weight: 600; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrapr { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.base { align-items: baseline; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sep { border-top: 1px solid var(--line3); padding-top: 12px; }

.btn { min-height: 44px; border-radius: 10px; border: 1px solid var(--fieldline); background: var(--field); color: var(--ink); font-size: 16px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.1; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn.lg { min-height: 52px; font-size: 18px; font-weight: 600; }
.btn.sq { width: 44px; padding: 0; }
.btn.pill { border-radius: 999px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.dark .btn { background: var(--leather3); border-color: var(--stitch); color: var(--cream); }
.dark .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.dark .btn.dashed { background: transparent; border-style: dashed; border-color: #8C6F3E; }
.x { width: 44px; height: 44px; flex: none; border: 0; background: transparent; color: #8A7250; display: inline-flex; align-items: center; justify-content: center; padding: 0; }

.field { height: 44px; padding: 0 12px; border: 1px solid var(--fieldline); border-radius: 10px; background: var(--field); color: var(--ink); font-size: 17px; width: 100%; min-width: 0; }
textarea.field { height: auto; min-height: 120px; padding: 10px 12px; line-height: 1.4; resize: vertical; }
select.field { padding: 0 8px; font-size: 16px; }
.field.num { width: 64px; text-align: center; font-family: var(--display); font-size: 19px; padding: 0 4px; }
.dark .field { background: var(--leather3); border-color: var(--stitch); color: var(--cream); }
.lbl { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
.dark .lbl { color: var(--tan); }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 16px; }
.chip .x { width: 32px; height: 32px; margin: -6px -8px -6px 0; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: 4px; }
.dark .bar { background: #46331C; }
.dark .bar > i { background: var(--gold); }
.dark .bar.low > i { background: var(--danger); }
.tile { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); }
.tile .k { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
.tile.dark { background: var(--leather2); border-color: var(--leather2); color: var(--cream); }
.tile.dark .k { color: var(--gold); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; margin-bottom: 16px; border-radius: 14px; background: var(--chip); padding-right: 56px; }

.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; background: var(--line2); border-radius: 12px; max-width: 100%; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 16px; color: var(--ink); padding: 0 14px; }
.seg button[aria-pressed="true"] { background: var(--card); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card2); font-size: 16px; text-align: left; width: 100%; }
.switch .t { width: 40px; height: 24px; border-radius: 12px; background: #C9B488; display: flex; align-items: center; padding: 2px; flex: none; }
.switch .t::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--field); }
.switch[aria-pressed="true"] .t { background: var(--red); justify-content: flex-end; }

.list-row { display: flex; align-items: center; gap: 8px; min-height: 46px; border-bottom: 1px solid var(--line3); }
.list-row:last-child { border-bottom: 0; }
.bonus { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--cream); white-space: nowrap; }
.bonus.off { background: var(--line3); color: #7A6447; }

/* abilities */
.abgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
.ab { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line2); border-radius: 12px; background: var(--card2); }
.ab .v { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1; }
.ab .d { font-size: 13px; line-height: 1.2; color: var(--muted); min-height: 16px; }
.ab .row .btn { min-height: 40px; }
.ab .row .btn.sq { width: 38px; }

/* codewords */
.cw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.cw { height: 44px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 4px; }
.cw[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--on-red); font-weight: 600; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--parch); padding: 8px 52px 12px 0; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; height: 46px; max-width: 640px; padding: 0 12px; border: 1px solid var(--fieldline); border-radius: 12px; background: var(--field); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; outline: none; color: var(--ink); }
.letter { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.letter h2 { margin: 0; font-family: var(--display); font-size: 22px; color: var(--red); }

/* paragraphs */
.bookbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; padding-right: 52px; margin-bottom: 14px; }
.bookbar button { flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; color: var(--ink); white-space: nowrap; }
.bookbar button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
.para { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-height: 80px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-align: left; }
.para .n { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1; display: flex; justify-content: space-between; width: 100%; }
.para .note { font-size: 13px; line-height: 1.2; color: var(--muted); }
.para .pips { display: flex; gap: 4px; }
.para .pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--red); }
.para .pips i.on { background: var(--red); }
.para.part { background: #F3E3C4; border-color: #C9A267; }
.para.full { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.para.full .note { color: #CDBB97; }
.para.full .pips i { border-color: var(--cream); }
.para.full .pips i.on { background: var(--cream); }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.split > .side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.bm-btn { min-height: 52px; background: var(--ink); color: var(--cream); border: 0; border-radius: 16px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
.bm-btn .v { font-family: var(--display); font-size: 22px; font-weight: 600; }

/* quests, ships, saves, wizard */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.quest.done { opacity: 0.72; }
.quest.done .qtitle { text-decoration: line-through; }
.badge { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--chip); color: #6B4A12; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; }
.badge.on { background: var(--red); color: var(--on-red); }
.pill-tag { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: #6B4A12; }
.prof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.prof { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); text-align: left; color: var(--ink); }
.prof[aria-pressed="true"] { border-color: var(--red); background: #FFF8E8; }
.prof .pbar { display: grid; grid-template-columns: 82px minmax(0, 1fr) 16px; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.prof .pbar b { font-family: var(--display); color: var(--ink); text-align: right; }
.prof .pbar span.b { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
.prof .pbar span.b i { display: block; height: 100%; background: #B8975A; }
.prof .pbar span.b i.hi { background: var(--red); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.steps i { height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--red); }
.narrow { max-width: 560px; }

/* fixed chrome */
.etab { position: fixed; right: 0; z-index: 25; width: calc(40px + env(safe-area-inset-right, 0px)); padding-right: env(safe-area-inset-right, 0px); border: 0; border-radius: 12px 0 0 12px; box-shadow: -6px 6px 16px -6px rgba(30,20,11,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
#tab-dice { top: calc(130px + env(safe-area-inset-top, 0px)); height: 52px; background: var(--leather2); color: var(--gold); }
#tab-bm { top: calc(190px + env(safe-area-inset-top, 0px)); min-height: 76px; padding-block: 8px; background: var(--gold); color: var(--leather); }
#tab-bm span { writing-mode: vertical-rl; font-family: var(--display); font-size: 13px; font-weight: 700; }
#scrim { position: fixed; inset: 0; z-index: 48; border: 0; padding: 0; background: rgba(20,12,5,0.5); }
#menu { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: 0; width: min(320px, 84vw); z-index: 50; transform: translateX(100%); transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
#menu.open { transform: none; }
#tab-menu { position: absolute; left: -40px; top: 0; width: 40px; height: 104px; border: 0; padding: 0; border-radius: 14px 0 0 14px; background: var(--red); color: var(--on-red); box-shadow: -6px 6px 16px -6px rgba(30,20,11,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
#tab-menu span { writing-mode: vertical-rl; font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; }
#menu-body { background: var(--leather); color: #E9DDBF; border-radius: 0 0 0 18px; padding: 16px 16px 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: calc(100vh - 36px - env(safe-area-inset-top, 0px)); overflow: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: -10px 10px 30px -10px rgba(0,0,0,0.6); }
.nlabel { font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; color: var(--tan2); text-transform: uppercase; }
.nitem { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #D9CBA8; font-size: 17px; text-align: left; width: 100%; }
.nitem[aria-current="page"] { background: var(--leather3); color: var(--on-red); }
.nitem[aria-current="page"] svg { color: var(--gold); }
.nitem .cnt { margin-left: auto; font-size: 13px; background: var(--leather3); border-radius: 999px; padding: 1px 8px; }
.jump { min-height: 40px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; border: 0; background: var(--leather4); color: var(--cream); font-size: 15px; }
.bookt { height: 50px; border: 0; border-radius: 10px; background: var(--leather4); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
.bookt b { font-family: var(--display); font-size: 17px; color: var(--gold); }
.bookt span { font-size: 12px; color: var(--tan); }
.bookt[aria-current="page"] { background: var(--gold); }
.bookt[aria-current="page"] b { color: var(--leather); }
.bookt[aria-current="page"] span { color: var(--ink); }
.letters a, .letters button { height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 0; background: var(--leather4); font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold); }
#menu-body .switch { background: transparent; border-color: #3D2C18; color: #E9DDBF; }
#menu-body .switch .t { background: var(--stitch); }
#menu-body .switch[aria-pressed="true"] .t { background: var(--red); }
.savesbtn { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 12px; border: 1px solid #3D2C18; background: transparent; color: #E9DDBF; text-align: left; }
.savesbtn[aria-current="page"] { background: var(--leather3); }

#dice { position: fixed; right: 0; bottom: 0; z-index: 40; width: min(100vw, 440px); max-height: min(88vh, 860px); overflow: auto; background: var(--card); border: 1px solid #C9B488; border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px -10px rgba(30,20,11,0.5); padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; transform: translateY(110%); visibility: hidden; transition: transform 240ms cubic-bezier(.2,.8,.2,1), visibility 0s linear 240ms; }
#dice.open { transform: none; visibility: visible; transition: transform 240ms cubic-bezier(.2,.8,.2,1); }
.die { width: 44px; height: 44px; border-radius: 10px; background: var(--field); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; font-weight: 700; flex: none; }
.result { border-radius: 14px; padding: 14px; color: var(--on-red); display: flex; flex-direction: column; gap: 10px; }
.result.ok { background: var(--ok); }
.result.bad { background: var(--red); }
.result.neutral { background: var(--stitch); }
.result .btn { background: transparent; border-color: currentColor; color: inherit; }
.abpick { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 58px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); color: var(--ink); padding: 0; }
.abpick small { font-family: var(--display); font-size: 10px; letter-spacing: 0.08em; }
.abpick b { font-family: var(--display); font-size: 20px; }
.abpick[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.log { font-size: 15px; line-height: 1.3; }
.log.enemy { color: var(--red); }

#bm-pop { position: fixed; right: calc(48px + env(safe-area-inset-right, 0px)); top: calc(130px + env(safe-area-inset-top, 0px)); z-index: 35; width: min(320px, calc(100vw - 64px)); background: var(--leather); color: #E9DDBF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6); max-height: calc(100vh - 150px); overflow: auto; }
#bm-pop .g7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
#bm-pop .g7 button { height: 40px; border: 0; border-radius: 8px; background: var(--leather4); color: var(--gold); font-family: var(--display); font-weight: 700; font-size: 16px; padding: 0; }
#bm-pop .g7 button[aria-pressed="true"] { background: var(--gold); color: var(--leather); }
#bm-pop .pfield { flex: 1; display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 12px; border: 1px solid var(--stitch); border-radius: 12px; background: var(--leather2); }

/* ---------- game state ---------- */
function newGame(o) {
  const base = {};
  AB.forEach((a, i) => { base[a] = PROFS[o.prof][i]; });
  return {
    v: 1, example: false, savedAt: Date.now(),
    char: {
      name: o.name, prof: o.prof, god: o.god || '', rank: 1, base, stam: 9, max: 9, money: 16, defAdj: 0,

function exampleGame() {

/* ---------- storage ---------- */
const LS_SLOTS = 'flc_slots';
const LS_ACTIVE = 'flc_active';
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let slots = lsGet(LS_SLOTS);
if (!slots || typeof slots !== 'object') slots = {};
let active = lsGet(LS_ACTIVE);
if (!active || !slots[active]) {
  const names = Object.keys(slots);
  if (names.length) active = names[0];
  else { active = 'Example – Aldric Vane'; slots[active] = exampleGame(); }
}
let G = slots[active];
let saveTimer = null;
let storageOk = true;
function flush() { storageOk = lsSet(LS_SLOTS, slots) && lsSet(LS_ACTIVE, active); }
function save() {
  G.savedAt = Date.now();
  slots[active] = G;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { clearTimeout(saveTimer); flush(); } });

/* ---------- derived ---------- */
function best(type) {
  let b = 0, src = '', id = null;
  G.char.items.forEach((it) => { if (it.type === type && it.bonus > b) { b = it.bonus; src = it.name; id = it.id; } });
  return { b, src, id };
}
const eff = (a) => clamp(G.char.base[a] + best(a).b, 1, 12);
const defence = () => eff('Combat') + G.char.rank + best('Defence').b + G.char.defAdj;
function bookStats(n) {
  const B = BOOKS[n], t = G.ticks[n] || {};
  let done = 0, boxes = 0;
  B.paras.forEach((p) => { const m = B.multi[p] || 1; boxes += m; done += Math.min(m, t[p] || 0); });
  return { done, boxes };
}
function setStam(v) {
  const n = Math.max(0, v);
  if (n <= 0 && G.char.stam > 0) UI.dead = true;
  G.char.stam = n;
  return n;
}
function setBookmark(b, p) {
  b = String(b); p = String(p);

}

function scrCharacter() {

      <div class="stack sep">
        <div class="row between base"><h2 class="h2">Shards</h2><span class="big">${c.money}</span></div>
        <div class="g4">
          <button class="btn" data-act="money" data-d="-10">−10</button><button class="btn" data-act="money" data-d="-1">−1</button>

          <div class="lbl">Profession<span class="field" style="display:flex;align-items:center;background:var(--card2);border-color:var(--line2)">${esc(c.prof)}</span></div>
          <label class="lbl" for="c-god">God<input id="c-god" class="field" placeholder="None" data-bind="G.char.god" value="${esc(c.god)}"></label>

    <section class="card" id="abilities">
      <div><h2 class="h2">Abilities</h2><div class="s15 muted">Score = base + best item bonus. Range 1–12.</div></div>

        ${AB.map((a) => {
          const base = c.base[a], bb = best(a);
          return `<div class="ab">
            <div class="row between base"><span class="small" style="font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--muted)">${a.toUpperCase()}</span><span class="v">${eff(a)}</span></div>
            <span class="d">${bb.b ? `${base} + ${bb.b} ${esc(bb.src)}` : 'base ' + base}</span>
            <div class="row" style="gap:4px">
              <button class="btn sq" data-act="ab" data-ab="${a}" data-d="-1" aria-label="Lower ${a}" ${base <= 1 ? 'disabled' : ''}>−</button>

    <section class="card" id="possessions">

      <div>
        ${c.items.map((it) => `<div class="list-row">
          <span class="grow row wrapr" style="gap:4px 8px"><span>${esc(it.name)}</span>${it.type && it.bonus ? `<span class="bonus${counted[it.type] === it.id ? '' : ' off'}">${esc(it.type)} +${it.bonus}${counted[it.type] === it.id ? '' : ' · not counted'}</span>` : ''}</span>
          <button class="x" data-act="item-remove" data-id="${it.id}" aria-label="Remove ${esc(it.name)}">${IC.x}</button></div>`).join('') || '<div class="muted">Nothing carried.</div>'}

          <label class="row s15 muted" for="item-bonus" style="gap:4px">+</label>

    <section class="card" id="honours">
      <div class="stack">
        <h2 class="h2">Blessings</h2>

        <div class="row wrapr" style="gap:6px">
          ${BLESS.map((b) => c.blessings[b]
            ? `<span class="chip" style="background:var(--red);color:var(--on-red);padding:2px 2px 2px 12px">${b}<button class="btn" data-act="bless-use" data-b="${b}" style="min-height:36px;border-radius:999px;background:var(--red-d);border-color:var(--red-d);color:var(--on-red);font-size:14px;padding:0 10px">Use</button></span>`
            : `<button class="btn pill ghost" data-act="bless-add" data-b="${b}" style="border-style:dashed;min-height:40px;font-size:15px;color:var(--muted)">+ ${b}</button>`).join('')}
        </div>
      </div>
      <div class="stack">
        <h2 class="h2">Titles &amp; honours</h2>
        <div class="row wrapr">${c.titles.map((t, i) => `<span class="chip">${esc(t)}<button class="x" data-act="title-remove" data-i="${i}" aria-label="Remove ${esc(t)}">${IC.x}</button></span>`).join('') || '<span class="muted">None yet.</span>'}</div>
        <div class="row"><label class="sr" for="title-new">New title</label><input id="title-new" class="field grow" placeholder="Add a title…" data-bind="UI.title" value="${esc(UI.title)}" data-enter="title-add"><button class="btn ink" data-act="title-add">Add</button></div>
      </div>
      <div class="stack">
        <h2 class="h2">Resurrection</h2>
        <label class="sr" for="res-text">Resurrection arrangement</label>
        <input id="res-text" class="field" placeholder="No resurrection arranged" data-bind="G.char.resText" value="${esc(c.resText)}">
        <div class="row">
          <label class="row s15 muted" for="res-book">Book</label><input id="res-book" class="field num" style="width:52px" inputmode="numeric" data-bind="G.char.resBook" value="${esc(c.resBook)}">
          <label class="row s15 muted" for="res-para">§</label><input id="res-para" class="field num" style="width:76px" inputmode="numeric" data-bind="G.char.resPara" value="${esc(c.resPara)}">
        </div>
      </div>
    </section>
  </div>`;
}

function scrQuests() {
  const list = G.quests.filter((q) => UI.questFilter === 'all' || (UI.questFilter === 'open' ? !q.done : q.done));
  const open = G.quests.filter((q) => !q.done).length;
  const f = (k, l) => `<button data-act="quest-filter" data-f="${k}" aria-pressed="${pressed(UI.questFilter === k)}">${l}</button>`;
  return `
  ${header('Adventurer', 'Quests', `${open} open · ${G.quests.length - open} done`)}
  <div class="row wrapr" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Filter quests">${f('open', 'Open')}${f('done', 'Done')}${f('all', 'All')}</div></div>
  <div class="cards">
    <section class="card" id="quest-new">
      <h2 class="h2">New quest</h2>
      <label class="lbl" for="qn-what">What<input id="qn-what" class="field" placeholder="The task…" data-bind="UI.quest.what" value="${esc(UI.quest.what)}"></label>
      <div class="g2">
        <label class="lbl" for="qn-from">From<input id="qn-from" class="field" placeholder="Who asked…" data-bind="UI.quest.from" value="${esc(UI.quest.from)}"></label>
        <label class="lbl" for="qn-where">Where<input id="qn-where" class="field" placeholder="Where to go…" data-bind="UI.quest.where" value="${esc(UI.quest.where)}"></label>
      </div>
      <label class="lbl" for="qn-for">Reward<input id="qn-for" class="field" placeholder="What you get…" data-bind="UI.quest.for" value="${esc(UI.quest.for)}" data-enter="quest-add"></label>
      <button class="btn primary" data-act="quest-add">Add quest</button>
    </section>
    ${list.map((q) => {
      const i = G.quests.indexOf(q);
      return `<section class="card quest${q.done ? ' done' : ''}">
        <div class="row between"><span class="pill-tag">${q.done ? 'Done' : 'Open'}</span><button class="x" data-act="quest-remove" data-id="${q.id}" aria-label="Delete quest">${IC.trash}</button></div>
        <label class="lbl" for="q-${q.id}-what">What<input id="q-${q.id}-what" class="field qtitle" data-bind="G.quests.${i}.what" value="${esc(q.what)}"></label>
        <div class="g2">
          <label class="lbl" for="q-${q.id}-from">From<input id="q-${q.id}-from" class="field" data-bind="G.quests.${i}.from" value="${esc(q.from)}"></label>
          <label class="lbl" for="q-${q.id}-where">Where<input id="q-${q.id}-where" class="field" data-bind="G.quests.${i}.where" value="${esc(q.where)}"></label>
        </div>
        <label class="lbl" for="q-${q.id}-for">Reward<input id="q-${q.id}-for" class="field" data-bind="G.quests.${i}.for" value="${esc(q.for)}"></label>
        <button class="btn ${q.done ? '' : 'ink'}" data-act="quest-done" data-id="${q.id}">${q.done ? 'Reopen quest' : IC.check + ' Mark as done'}</button>
      </section>`;
    }).join('')}
  </div>
  ${list.length ? '' : `<p class="muted">${UI.questFilter === 'done' ? 'No finished quests yet.' : 'No open quests. Add one when the book gives you a task.'}</p>`}`;
}

  <div class="cards">
    ${G.ships.map((s, i) => `<section class="card" id="ship-${s.id}">
      <div class="row between"><h2 class="h2">Ship ${i + 1}</h2><button class="x" data-act="ship-remove" data-id="${s.id}" aria-label="Remove ship">${IC.trash}</button></div>
      <div class="g2">

        <label class="lbl" for="s-${s.id}-crew">Crew quality<select id="s-${s.id}-crew" class="field" data-bind="G.ships.${i}.crew">${CREW.map((c) => `<option ${s.crew === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        <label class="lbl" for="s-${s.id}-cap">Capacity<input id="s-${s.id}-cap" class="field" inputmode="numeric" data-bind="G.ships.${i}.cap" value="${esc(s.cap)}"></label>
      </div>
      <label class="lbl" for="s-${s.id}-cargo">Cargo<input id="s-${s.id}-cargo" class="field" placeholder="What’s in the hold…" data-bind="G.ships.${i}.cargo" value="${esc(s.cargo)}"></label>
      <label class="lbl" for="s-${s.id}-dock">Docked at<input id="s-${s.id}-dock" class="field" placeholder="Port…" data-bind="G.ships.${i}.dock" value="${esc(s.dock)}"></label>
      <label class="lbl" for="s-${s.id}-notes">Notes<textarea id="s-${s.id}-notes" class="field" style="min-height:80px" data-bind="G.ships.${i}.notes">${esc(s.notes)}</textarea></label>

function cwGroups() {
  const q = UI.q.trim().toLowerCase();
  const groups = {};
  CW.forEach((w) => {
    const on = !!G.codewords[w];
    if (q && w.toLowerCase().indexOf(q) === -1) return;
    if (UI.onlyMarked && !on) return;
    (groups[w[0]] = groups[w[0]] || []).push({ w, on });
  });
  return groups;
}
function scrCodewords() {
  const groups = cwGroups();
  const keys = Object.keys(groups).sort();
  return `
  ${header('Acid – Gush', 'Codewords', '', `<div class="sub"><b style="color:var(--red);font-family:var(--display);font-size:22px">${markedCount()}</b> of ${CW.length} marked</div>`)}
  <div class="sticky"><label class="search" for="cw-q">${IC.search}<span class="sr">Search codewords</span><input id="cw-q" type="search" placeholder="Find a codeword…" data-bind="UI.q" data-live value="${esc(UI.q)}" autocomplete="off"></label></div>
  <div class="stack" style="gap:20px;padding-top:8px">
    ${keys.length ? '' : `<p class="muted" style="text-align:center;padding:32px 8px;font-style:italic">${UI.onlyMarked && !UI.q ? 'No codewords marked yet.' : `No codeword matches “${esc(UI.q)}”.`}</p>`}
    ${keys.map((k) => {
      const n = groups[k].filter((x) => x.on).length;
      return `<section class="stack" id="cw-${k}">
        <div class="letter"><h2>${k}</h2><span class="small muted">${groups[k].length} words${n ? ' · ' + n + ' marked' : ''}</span></div>
        <div class="cw-grid">${groups[k].map((x) => `<button class="cw" data-act="cw" data-w="${x.w}" aria-pressed="${pressed(x.on)}">${x.on ? IC.check : ''}${x.w}</button>`).join('')}</div>
      </section>`;
    }).join('')}
  </div>`;
}

function scrBook() {
  const n = UI.book, B = BOOKS[n], t = G.ticks[n] || {}, st = bookStats(n);
  const f = (k, l) => `<button data-act="para-filter" data-f="${k}" aria-pressed="${pressed(UI.paraFilter === k)}">${l}</button>`;
  const paras = B.paras.map((p) => {
    const m = B.multi[p] || 1, c = Math.min(m, t[p] || 0), full = c >= m;
    if (UI.paraFilter === 'open' && full) return '';
    if (UI.paraFilter === 'done' && c === 0) return '';
    const note = cleanNote(B.notes[p]);
    let pips = '';
    if (m > 1) { pips = '<span class="pips">'; for (let i = 0; i < m; i++) pips += `<i class="${i < c ? 'on' : ''}"></i>`; pips += '</span>'; }
    return `<button class="para${full ? ' full' : c ? ' part' : ''}" data-act="para" data-p="${p}" aria-label="§${p}${m > 1 ? `, ${c} of ${m} ticked` : full ? ', visited' : ', not visited'}">
      <span class="n">§${p}${full ? IC.check : ''}</span>${pips}${note ? `<span class="note">${esc(note)}</span>` : ''}</button>`;
  }).join('');
  return `
  <div class="bookbar" role="group" aria-label="Choose book">${[1, 2, 3, 4, 5, 6, 7].map((b) => `<button data-act="book" data-book="${b}" aria-pressed="${pressed(String(b) === String(n))}">${b} · ${BOOK_TITLES[b]}</button>`).join('')}</div>
  <header class="head" id="top">
    <div style="flex:1 1 320px" class="stack">
      <div><div class="eyebrow">Book ${n}</div><h1 class="title">${BOOK_TITLES[n]}</h1></div>
      <div class="row wrapr" style="max-width:720px;gap:4px 12px"><div class="bar" style="flex:1 1 200px"><i style="width:${Math.round(100 * st.done / st.boxes)}%"></i></div><span class="s15 muted">${st.done} of ${st.boxes} boxes ticked</span></div>
    </div>
    <button class="bm-btn" data-act="bm-open" style="flex:0 1 320px">${IC.mark}<span class="grow s15" style="color:var(--tan)">Bookmark</span><span class="v">B${esc(G.bookmark.book)} · §${esc(G.bookmark.para)}</span></button>
  </header>
  <div class="split">
    <section class="main" id="paragraphs">
      <div class="row wrapr between"><div class="seg" role="group" aria-label="Filter paragraphs">${f('all', 'All')}${f('open', 'Not yet')}${f('done', 'Ticked')}</div><span class="small muted">Tap to tick. Multi-visit boxes count up.</span></div>
      <div class="pgrid">${paras || '<p class="muted">Nothing to show for this filter.</p>'}</div>
    </section>
    <aside class="side">
      <section class="card" id="places">
        <h2 class="h2">Known places</h2>
        <div class="small muted">Locations you keep returning to. Tap to set your bookmark.</div>
        <div>${G.places.map((pl) => `<div class="list-row">
          <button class="grow row between" data-act="place-go" data-id="${pl.id}" style="min-height:44px;border:0;background:transparent;padding:0;text-align:left"><span>${esc(pl.name)}</span><span class="muted">B${esc(pl.book)} · §${esc(pl.para)}</span></button>
          <button class="x" data-act="place-remove" data-id="${pl.id}" aria-label="Remove ${esc(pl.name)}">${IC.x}</button></div>`).join('') || '<div class="muted s15">No places saved yet.</div>'}</div>
        <div class="row">
          <label class="sr" for="pl-name">Place name</label><input id="pl-name" class="field grow" placeholder="Place…" data-bind="UI.place.name" value="${esc(UI.place.name)}">
          <label class="sr" for="pl-para">Paragraph</label><input id="pl-para" class="field num" placeholder="§" inputmode="numeric" data-bind="UI.place.para" value="${esc(UI.place.para)}" data-enter="place-add">
          <button class="btn ink" data-act="place-add">Add</button>
        </div>
        <div class="small muted">New places are saved for Book ${n}.</div>
      </section>
      <label class="stack" id="notes" for="notes-${n}">
        <span class="h2">Notes</span>
        <textarea id="notes-${n}" class="field" style="min-height:180px" placeholder="Notes for this book…" data-bind="G.notes.${n}">${esc(G.notes[n] || '')}</textarea>
      </label>
    </aside>
  </div>`;
}

function scrSaves() {
  const names = Object.keys(slots).sort((a, b) => (slots[b].savedAt || 0) - (slots[a].savedAt || 0));
  const when = (ts) => { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };
  return `
  ${header('Your adventures', 'Saves &amp; Backup', '')}
  <div class="cols c3">
    <section class="card dark" id="current">
      <div class="row" style="gap:12px">
        <div class="badge" style="background:var(--leather3);color:var(--gold);border-radius:50%">${IC.check}</div>
        <div class="stack" style="gap:0"><span>${storageOk ? 'Saved automatically on this device' : 'Could not save on this device'}</span><span class="small muted">Slot: <b style="color:var(--cream)">${esc(active)}</b> · ${when(G.savedAt)}</span></div>
      </div>
      ${storageOk ? '' : '<div class="s15" style="color:#F2A493">Your browser blocks storage here. Export a backup file so you don’t lose progress.</div>'}
      <div class="row"><label class="sr" for="snap-name">Name for snapshot</label><input id="snap-name" class="field grow" placeholder="Name a snapshot…" data-bind="UI.snap" value="${esc(UI.snap)}" data-enter="snap-save"><button class="btn gold" data-act="snap-save">Save copy</button></div>
      <div class="small muted">A snapshot is a copy you can go back to, e.g. before a risky fight.</div>
    </section>
    <section class="card" id="slots" style="gap:0">
      <h2 class="h2" style="margin-bottom:6px">Save slots</h2>
      ${names.map((n) => {
        const s = slots[n], on = n === active;
        return `<div class="stack" style="padding:12px 0;border-top:1px solid var(--line3)">
          <div class="row" style="gap:12px"><div class="badge${on ? ' on' : ''}">${esc(n[0] || '?')}</div>
            <div class="grow stack" style="gap:0"><b style="font-weight:600">${esc(n)}</b><span class="small muted">${esc(s.char.prof)} · Rank ${s.char.rank} · Book ${esc(s.bookmark.book)} §${esc(s.bookmark.para)} · ${when(s.savedAt)}</span></div>
            ${on ? '<span class="pill-tag">Playing</span>' : ''}</div>
          ${on ? '' : `<div class="row" style="padding-left:50px"><button class="btn grow" data-act="slot-load" data-n="${esc(n)}">Load</button><button class="btn sq" data-act="slot-delete" data-n="${esc(n)}" aria-label="Delete ${esc(n)}">${IC.trash}</button></div>`}
        </div>`;
      }).join('')}
    </section>
    <section class="card" id="backup">
      <h2 class="h2">Backup</h2>
      <span class="muted">Browsers can clear app data. Keep a file copy in your cloud drive.</span>
      <div class="g2"><button class="btn ink" data-act="export">Export file</button><button class="btn" data-act="import">Import file</button></div>
      <button class="btn ghost" data-act="export-copy">Copy backup to clipboard</button>
    </section>
    <section class="card warn" id="new">
      <h2 class="h2">New adventure</h2>
      <span class="muted">Choose a name and profession; your starting sheet is filled in for you. Your current slot stays untouched.</span>
      <button class="btn danger" data-act="go-create" style="font-weight:600">Start new character</button>
    </section>

/* ---------- render ---------- */
const SCR = { character: scrCharacter, quests: scrQuests, ships: scrShips, codewords: scrCodewords, book: scrBook, saves: scrSaves, create: scrCreate };
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || a === document.body) return null;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (x) { /* not a text field */ }
  return { id: a.id, s, e };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || document.activeElement === el) return;
  try { el.focus({ preventScroll: true }); if (f.s != null && el.setSelectionRange) el.setSelectionRange(f.s, f.e); } catch (x) { /* ignore */ }
}
function renderLayer() { $('#layer').innerHTML = layerHTML(); }
function render() {
  const f = captureFocus();
  $('#main').innerHTML = SCR[UI.screen]();
  const mb = $('#menu-body'), mt = mb.scrollTop;
  mb.innerHTML = menuHTML(); mb.scrollTop = mt;
  $('#menu').classList.toggle('open', UI.menu);
  mb.inert = !UI.menu;
  $('#scrim').hidden = !UI.menu;
  const tm = $('#tab-menu');
  tm.setAttribute('aria-expanded', pressed(UI.menu));
  tm.setAttribute('aria-label', UI.menu ? 'Close menu' : 'Open menu');
  $('#tab-menu-text').textContent = UI.menu ? 'CLOSE' : 'MENU';
  const dz = $('#dice'), dt = dz.scrollTop;
  dz.innerHTML = UI.dice ? diceHTML() : '';
  dz.scrollTop = dt;
  dz.classList.toggle('open', !!UI.dice);
  dz.inert = !UI.dice;
  $('#tab-dice').setAttribute('aria-expanded', pressed(!!UI.dice));
  $('#tab-bm').setAttribute('aria-expanded', pressed(UI.bm));
  $('#tab-bm').setAttribute('aria-label', `Bookmark: Book ${G.bookmark.book}, paragraph ${G.bookmark.para}`);
  $('#tab-bm-text').textContent = '§' + G.bookmark.para;
  renderLayer();
  restoreFocus(f);
}

/* ---------- navigation ---------- */
function go(screen, opts) {
  if (SCREENS.indexOf(screen) === -1) screen = 'character';
  UI.screen = screen; UI.menu = false; UI.bm = false;
  if (opts && opts.book) UI.book = String(opts.book);
  if (location.hash.slice(1) !== screen) { try { history.replaceState(null, '', '#' + screen); } catch (e) { /* sandboxed */ } }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SCREENS.indexOf(h) !== -1 && h !== UI.screen) go(h); });

/* ---------- dice ---------- */
function roll2() {
  if (UI.phys) {
    const a = int(UI.pd1), b = int(UI.pd2);
    if (!a || !b || a < 1 || a > 6 || b < 1 || b > 6) { UI.diceErr = 'Enter two dice values from 1 to 6.'; return null; }
    UI.diceErr = ''; UI.pd1 = ''; UI.pd2 = '';
    return [a, b];
  }
  UI.diceErr = '';
  return [d6(), d6()];
}
function doCheck(rerolled) {
  const d = roll2();
  if (!d) return;
  const ab = UI.checkAb, v = eff(ab), total = d[0] + d[1] + v;
  UI.check = { d1: d[0], d2: d[1], v, total, diff: UI.diff, ok: total > UI.diff, ab, rerolled: !!rerolled };
}
function fightStep() {
  const f = UI.fight, d = roll2();
  if (!d) return;
  if (f.turn === 'you') {
    const c = eff('Combat'), total = d[0] + d[1] + c, dmg = Math.max(0, total - f.def);
    f.es = Math.max(0, f.es - dmg);
    f.log.unshift({ who: 'you', text: `R${f.round} · You: ${d[0]} + ${d[1]} + ${c} = ${total} vs Def ${f.def} → ${dmg ? dmg + ' damage' : 'miss'}` });
    if (f.es <= 0) f.over = 'won';
  } else {
    const def = defence(), total = d[0] + d[1] + f.combat, dmg = Math.max(0, total - def);
    f.log.unshift({ who: 'enemy', text: `R${f.round} · ${f.name}: ${d[0]} + ${d[1]} + ${f.combat} = ${total} vs Def ${def} → ${dmg ? 'you lose ' + dmg : 'miss'}` });
    if (setStam(G.char.stam - dmg) <= 0) f.over = 'lost';
    save();
  }
  if (f.turn !== f.first) f.round += 1;
  f.turn = f.turn === 'you' ? 'enemy' : 'you';
}

/* ---------- export / import ---------- */
function backupJSON() { return JSON.stringify({ format: 'fabled-lands-companion', v: 1, exportedAt: new Date().toISOString(), active, slots }, null, 2); }
function exportFile() {
  try {
    const blob = new Blob([backupJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `fabled-lands-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Backup file created. If nothing downloaded, use “Copy backup to clipboard”.');
  } catch (e) { toast('Export failed. Use “Copy backup to clipboard” instead.'); }
}
function importData(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('That file is not a valid backup.'); render(); return; }
  if (!data || data.format !== 'fabled-lands-companion' || !data.slots) { toast('That file is not a Fabled Lands backup.'); render(); return; }
  let n = 0;
  Object.keys(data.slots).forEach((name) => {
    const s = data.slots[name];
    if (!s || !s.char) return;
    let key = name;
    while (slots[key]) key = key + ' (imported)';
    slots[key] = s; n++;
  });
  flush();
  toast(n ? `Imported ${n} save${n === 1 ? '' : 's'}.` : 'No saves found in that file.');
  render();
}
$('#import-file').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => importData(String(r.result));
  r.readAsText(file);
  e.target.value = '';
});

/* ---------- actions ---------- */
function ask(text, okAct, ok) { UI.confirm = { text, act: okAct, ok }; }
const A = {
  'nav': (d) => go(d.to, { book: d.book }),
  'go-create': () => { UI.wiz = { step: 1, name: '', prof: '', god: '', err: '' }; go('create'); },
  'menu-toggle': () => { UI.menu = !UI.menu; UI.bm = false; },
  'menu-close': () => { UI.menu = false; },
  'jump': (d) => { UI.menu = false; render(); const el = document.getElementById(d.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return false; },
  'dice-toggle': () => { UI.dice = UI.dice ? null : 'check'; UI.menu = false; UI.bm = false; },
  'dice-close': () => { UI.dice = null; },
  'dice-tab': (d) => { UI.dice = d.t; UI.diceErr = ''; },
  'bm-toggle': () => { UI.bm = !UI.bm; UI.menu = false; UI.bmBook = G.bookmark.book; UI.bmDraft = G.bookmark.para; },
  'bm-open': () => { UI.bm = true; UI.bmBook = G.bookmark.book; UI.bmDraft = G.bookmark.para; },
  'bm-close': () => { UI.bm = false; },
  'bm-book': (d) => { UI.bmBook = d.book; },
  'bm-set': () => { const p = int(UI.bmDraft); if (!p) { toast('Enter a paragraph number.'); return; } setBookmark(UI.bmBook, p); UI.bm = false; save(); toast(`Bookmark set to Book ${UI.bmBook}, §${p}.`); },
  'bm-go': (d) => { setBookmark(d.book, d.p); UI.bm = false; save(); },
  'stam': (d) => { const n = +d.d; if (n < 0) setStam(G.char.stam + n); else G.char.stam = Math.min(G.char.max, G.char.stam + n); save(); },
  'stam-full': () => { G.char.stam = Math.max(G.char.stam, G.char.max); save(); },
  'max': (d) => { G.char.max = Math.max(1, G.char.max + (+d.d)); if (G.char.stam > G.char.max) G.char.stam = G.char.max; save(); },
  'rank-open': () => { UI.rankDlg = true; UI.rankGain = ''; },
  'rank-close': () => { UI.rankDlg = false; },
  'rank-roll': () => { UI.rankGain = String(d6()); },
  'rank-confirm': () => { const g = Math.max(0, int(UI.rankGain) || 0); G.char.rank += 1; G.char.max += g; G.char.stam += g; UI.rankDlg = false; save(); toast(`You are now Rank ${G.char.rank}.`); },
  'adj': (d) => { G.char.defAdj += +d.d; save(); },
  'money': (d) => { G.char.money = Math.max(0, G.char.money + (+d.d)); save(); },
  'money-spend': () => { const a = int(UI.money); if (!a) return; if (Math.abs(a) > G.char.money) { toast(`You only have ${G.char.money} Shards.`); return; } G.char.money -= Math.abs(a); UI.money = ''; save(); },
  'money-gain': () => { const a = int(UI.money); if (!a) return; G.char.money += Math.abs(a); UI.money = ''; save(); },
  'ab': (d) => { G.char.base[d.ab] = clamp(G.char.base[d.ab] + (+d.d), 1, 12); save(); },
  'ab-roll': (d) => { UI.dice = 'check'; UI.checkAb = d.ab; UI.check = null; UI.bm = false; UI.menu = false; },
  'item-add': () => {
    const t = UI.item.name.trim();
    if (!t) return;
    if (G.char.items.length >= 12) { toast('You can carry 12 possessions.'); return; }
    const bonus = UI.item.type ? Math.max(0, int(UI.item.bonus) || 0) : 0;
    G.char.items.push({ id: uid(), name: t, type: bonus ? UI.item.type : '', bonus });
    UI.item = { name: '', type: '', bonus: '1' }; save();
  },
  'item-remove': (d) => { G.char.items = G.char.items.filter((i) => i.id !== d.id); save(); },
  'bless-add': (d) => { G.char.blessings[d.b] = true; save(); },
  'bless-use': (d) => { delete G.char.blessings[d.b]; save(); toast(`${d.b} blessing used.`); },
  'title-add': () => { const t = UI.title.trim(); if (!t) return; G.char.titles.push(t); UI.title = ''; save(); },
  'title-remove': (d) => { G.char.titles.splice(+d.i, 1); save(); },
  'cw': (d) => { if (G.codewords[d.w]) ask(`Lost the codeword <b>${esc(d.w)}</b>?`, { a: 'cw-remove', w: d.w }); else { G.codewords[d.w] = true; save(); } },
  'cw-remove': (d) => { delete G.codewords[d.w]; save(); },
  'cw-only': () => { UI.onlyMarked = !UI.onlyMarked; },
  'book': (d) => { UI.book = String(d.book); },
  'para': (d) => { const B = BOOKS[UI.book], m = B.multi[d.p] || 1; const t = G.ticks[UI.book] = G.ticks[UI.book] || {}; const c = t[d.p] || 0; t[d.p] = c >= m ? 0 : c + 1; if (!t[d.p]) delete t[d.p]; save(); },
  'para-filter': (d) => { UI.paraFilter = d.f; },
  'place-add': () => { const n = UI.place.name.trim(), p = int(UI.place.para); if (!n || !p) { toast('Enter a place name and a paragraph.'); return; } G.places.push({ id: uid(), name: n, book: String(UI.book), para: String(p) }); UI.place = { name: '', para: '' }; save(); },
  'place-remove': (d) => { G.places = G.places.filter((p) => p.id !== d.id); save(); },
  'place-go': (d) => { const p = G.places.find((x) => x.id === d.id); if (p) { setBookmark(p.book, p.para); UI.bm = false; save(); toast(`Bookmark set to ${p.name}, §${p.para}.`); } },
  'quest-filter': (d) => { UI.questFilter = d.f; },
  'quest-add': () => { const q = UI.quest; if (!q.what.trim()) { toast('Describe the quest first.'); return; } G.quests.unshift({ id: uid(), what: q.what.trim(), from: q.from.trim(), where: q.where.trim(), for: q.for.trim(), done: false }); UI.quest = { what: '', from: '', where: '', for: '' }; save(); },
  'quest-done': (d) => { const q = G.quests.find((x) => x.id === d.id); if (q) { q.done = !q.done; save(); } },
  'quest-remove': (d) => ask('Delete this quest?', { a: 'quest-del', id: d.id }, 'Delete'),
  'quest-del': (d) => { G.quests = G.quests.filter((x) => x.id !== d.id); save(); },
  'ship-add': () => { G.ships.push({ id: uid(), name: '', type: '', crew: 'Average', cap: '', cargo: '', dock: '', notes: '' }); save(); },
  'ship-remove': (d) => ask('Remove this ship?', { a: 'ship-del', id: d.id }),
  'ship-del': (d) => { G.ships = G.ships.filter((x) => x.id !== d.id); save(); },
  'snap-save': () => {
    let n = UI.snap.trim() || `${G.char.name} – Book ${G.bookmark.book} §${G.bookmark.para}`;
    while (slots[n]) n += ' (2)';
    slots[n] = JSON.parse(JSON.stringify(G)); slots[n].savedAt = Date.now();
    UI.snap = ''; flush(); toast(`Saved a copy as “${n}”.`);
  },
  'slot-load': (d) => { if (!slots[d.n]) return; flush(); active = d.n; G = slots[active]; UI.book = G.bookmark.book; UI.fight = null; UI.check = null; flush(); toast(`Loaded “${d.n}”.`); go('character'); return false; },
  'slot-delete': (d) => ask(`Delete the save <b>${esc(d.n)}</b> for good?`, { a: 'slot-del', n: d.n }, 'Delete'),
  'slot-del': (d) => { if (d.n === active) return; delete slots[d.n]; flush(); },
  'export': () => exportFile(),
  'export-copy': () => {
    const txt = backupJSON();
    try { navigator.clipboard.writeText(txt).then(() => { toast('Backup copied. Paste it into a note or file to keep it.'); }, () => { toast('Copying is blocked here. Use “Export file”.'); }); } catch (e) { toast('Copying is blocked here. Use “Export file”.'); }
  },
  'import': () => { $('#import-file').click(); return false; },
  'confirm-cancel': () => { UI.confirm = null; },
  'confirm-ok': () => { const c = UI.confirm; UI.confirm = null; if (c && A[c.act.a]) A[c.act.a](c.act); },
  'wiz-prof': (d) => { UI.wiz.prof = d.p; UI.wiz.err = ''; },
  'wiz-back': () => { if (UI.wiz.step === 1) { go('saves'); return false; } UI.wiz.step -= 1; UI.wiz.err = ''; },
  'wiz-next': () => {
    const w = UI.wiz;
    if (w.step === 1) { if (!w.name.trim()) { w.err = 'Please enter a name.'; return; } w.step = 2; w.err = ''; return; }
    if (w.step === 2) { if (!w.prof) { w.err = 'Please choose a profession.'; return; } w.step = 3; w.err = ''; return; }
    const g = newGame({ name: w.name.trim(), prof: w.prof, god: w.god.trim() });
    let key = g.char.name;
    while (slots[key]) key += ' (2)';
    flush();
    slots[key] = g; active = key; G = g; UI.book = '1'; UI.fight = null; UI.check = null;
    flush(); toast(`Welcome, ${g.char.name}. Turn to Book 1, §1.`);
    go('character'); return false;
  },
  'phys': () => { UI.phys = !UI.phys; UI.diceErr = ''; },
  'check-ab': (d) => { UI.checkAb = d.ab; UI.check = null; },
  'diff': (d) => { UI.diff = clamp(UI.diff + (+d.d), 2, 30); UI.check = null; },
  'check-roll': () => doCheck(false),
  'check-reroll': () => { const ab = UI.check.ab; delete G.char.blessings[ab]; save(); doCheck(true); },
  'first': (d) => { UI.enemy.first = d.w; },
  'fight-start': () => {
    const e = UI.enemy, c = int(e.combat), df = int(e.def), st = int(e.stam);
    if (c === null || df === null || !st) { UI.fErr = 'Enter numbers for COMBAT, Defence and Stamina.'; return; }
    UI.fErr = '';
    UI.fight = { name: e.name.trim() || 'Enemy', combat: c, def: df, es: st, emax: st, first: e.first, turn: e.first, round: 1, over: '', log: [] };
  },
  'fight-step': () => fightStep(),
  'fight-flee': () => { UI.fight.over = 'fled'; },
  'fight-close': () => { UI.fight = null; UI.enemy = { name: '', combat: '', def: '', stam: '', first: 'you' }; },
  'dead-go': () => { const c = G.char; setBookmark(c.resBook || '1', c.resPara); UI.dead = false; save(); go('book', { book: c.resBook || '1' }); return false; },
  'dead-dismiss': () => { UI.dead = false; }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (fn(el.dataset) !== false) render();
});

/* ---------- binding ---------- */
function setPath(path, value) {
  const parts = path.split('.');
  let obj = parts.shift() === 'G' ? G : UI;
  while (parts.length > 1) { const k = parts.shift(); if (obj[k] == null) obj[k] = {}; obj = obj[k]; }
  obj[parts[0]] = value;
  return path[0] === 'G';
}
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.bind) return;
  if (setPath(el.dataset.bind, el.value)) save();
  if ('live' in el.dataset) render();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.bind) return;
  if (setPath(el.dataset.bind, el.value)) save();
  if (el.tagName === 'SELECT' || el.dataset.bind.indexOf('G.char.') === 0 || el.dataset.bind.indexOf('G.quests') === 0) render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
    const el = e.target;
    if (el.dataset.bind) setPath(el.dataset.bind, el.value);
    e.preventDefault();
    if (A[el.dataset.enter](el.dataset) !== false) render();
  } else if (e.key === 'Escape') {
    if (UI.confirm) UI.confirm = null; else if (UI.bm) UI.bm = false; else if (UI.menu) UI.menu = false; else if (UI.dice) UI.dice = null; else return;
    render();
  }
});

/* ---------- start ---------- */
const h0 = location.hash.slice(1);
UI.screen = SCREENS.indexOf(h0) !== -1 && h0 !== 'create' ? h0 : 'character';
render();
flush();

if ('serviceWorker' in navigator && /^https:$/.test(location.protocol) && !/claude/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();

</script>
